# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main", "openDock" ]
  pull_request:
    branches: [ "main", "openDock" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check tracked privacy patterns
      run: python3 scripts/check-privacy.py
    - name: Build
      run: swift build -v
    - name: Test privacy regressions
      run: swift test
    - name: Build MAS flavor
      run: swift build -Xswiftc -DAPP_FLAVOR_MAS
